version: 2

models:
  - name: stg_customers
    description: "Cleaned and renamed customers from the raw source."
    columns:
      - name: customer_id
        description: "Primary key."
        tests:
          - unique
          - not_null

  - name: stg_orders
    description: "Cleaned and renamed orders from the raw source."
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: status
        tests:
          - accepted_values:
              values: ['placed', 'shipped', 'completed', 'return_pending', 'returned']

  - name: stg_payments
    description: "Cleaned payments with amount converted from cents to pounds."
    columns:
      - name: payment_id
        tests:
          - unique
          - not_null